<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FDT ניהול תקלות</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f8faff;--card:#fff;--border:#dde3f0;
  --accent:#e85d2f;--blue:#3b82f6;--green:#22c55e;--yellow:#f59e0b;--red:#ef4444;
  --text:#1e293b;--muted:#6b7280;--shadow:0 1px 6px rgba(0,0,0,.06);--font:'Heebo',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;}

/* NAV */
.nav{background:linear-gradient(135deg,#3b4f6b,#4a6080);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;position:sticky;top:0;z-index:50;box-shadow:0 2px 10px rgba(0,0,0,.12);}
.nav-title{font-size:17px;font-weight:800;color:#f97316;}
.nav-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.tab{padding:6px 12px;border-radius:8px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:rgba(255,255,255,.75);font-family:var(--font);font-size:13px;cursor:pointer;transition:all .2s;}
.tab.active,.tab:hover{background:#f97316;color:#fff;border-color:#f97316;}
.role-pill{padding:5px 12px;border-radius:20px;font-size:12px;font-weight:700;background:rgba(255,255,255,.12);color:#fed7aa;cursor:pointer;}

/* LOGIN */
#loginScreen{display:none;position:fixed;inset:0;background:linear-gradient(135deg,#3b4f6b,#4a6080);z-index:500;align-items:center;justify-content:center;}
#loginScreen.open{display:flex;}
.login-box{background:#fff;border-radius:24px;padding:32px;width:90%;max-width:340px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3);}
.login-box h2{font-size:20px;font-weight:800;margin-bottom:4px;}
.login-box p{font-size:13px;color:var(--muted);margin-bottom:20px;}
.pin-dots{display:flex;justify-content:center;gap:10px;margin-bottom:18px;}
.pin-dot{width:13px;height:13px;border-radius:50%;background:#e2e8f0;transition:background .15s;}
.pin-dot.filled{background:var(--blue);}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:220px;margin:0 auto 12px;}
.pin-btn{padding:15px;border-radius:12px;border:1.5px solid var(--border);background:#fff;font-family:var(--font);font-size:20px;font-weight:700;cursor:pointer;transition:all .15s;}
.pin-btn:active{background:#f1f5f9;transform:scale(.94);}
.login-error{color:var(--red);font-size:13px;min-height:18px;margin-top:6px;}
.login-cancel{color:var(--muted);font-size:13px;cursor:pointer;text-decoration:underline;margin-top:10px;display:inline-block;}

/* PAGES */
.page{display:none;padding:14px;max-width:900px;margin:0 auto;}
.page.active{display:block;}

/* TOOLBAR */
.toolbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center;}
.search-row{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
.search-row input,.search-row select{padding:9px 12px;border-radius:10px;border:1.5px solid var(--border);background:#fff;color:var(--text);font-family:var(--font);font-size:14px;flex:1;min-width:120px;box-shadow:var(--shadow);}

/* TICKET ROW */
.ticket-row{background:#fff;border:1.5px solid #dde3f0;border-radius:12px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:flex-start;gap:10px;box-shadow:0 1px 4px rgba(0,0,0,.05);cursor:pointer;transition:all .2s;}
.ticket-row:hover{border-color:#93c5fd;transform:translateY(-1px);}
.ticket-row.selected{border-color:#3b82f6;background:#eff6ff;}
.ticket-cb{flex-shrink:0;margin-top:2px;}
.ticket-cb input[type=checkbox]{width:18px;height:18px;cursor:pointer;accent-color:var(--blue);}
.ticket-body{flex:1;}
.ticket-top{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px;margin-bottom:6px;}
.ticket-id{font-size:13px;font-weight:700;color:var(--blue);}
.ticket-worker{font-size:13px;color:var(--muted);}
.ticket-addr{font-size:14px;font-weight:600;margin-bottom:4px;}
.ticket-badges{display:flex;gap:6px;flex-wrap:wrap;}
.badge{padding:2px 10px;border-radius:20px;font-size:11px;font-weight:600;}
.b-closed{background:#dcfce7;color:#16a34a;}
.b-open{background:#fee2e2;color:#dc2626;}
.b-wait{background:#fef3c7;color:#d97706;}
.b-cont{background:#dbeafe;color:#2563eb;}
.b-gray{background:#f1f5f9;color:#64748b;}

/* BULK BAR */
.bulk-bar{background:#1e293b;color:#fff;border-radius:12px;padding:10px 16px;display:none;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
.bulk-bar.show{display:flex;}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:200;display:none;align-items:flex-start;justify-content:center;padding:10px;overflow-y:auto;backdrop-filter:blur(3px);}
.overlay.open{display:flex;}
.modal{background:#fff;border-radius:20px;width:100%;max-width:640px;margin:auto;box-shadow:0 20px 60px rgba(0,0,0,.2);}
.modal-hdr{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#fff;border-radius:20px 20px 0 0;z-index:1;}
.modal-hdr h2{font-size:16px;font-weight:700;}
.modal-close{background:none;border:none;font-size:22px;color:var(--muted);cursor:pointer;}
.modal-body{padding:18px;}
.modal-ftr{padding:12px 18px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;background:#f8fafc;border-radius:0 0 20px 20px;}

/* FIELDS */
.field-row{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px;padding:8px 10px;border-radius:10px;border:1.5px solid #eef2fb;background:#f8faff;transition:background .15s;}
.field-row:hover{background:#eff4ff;}
.field-cb{flex-shrink:0;margin-top:18px;}
.field-cb input[type=checkbox]{width:16px;height:16px;accent-color:var(--blue);cursor:pointer;}
.field-inner{flex:1;}
.field-inner label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:4px;}
.field-inner input,.field-inner select,.field-inner textarea{width:100%;padding:8px 10px;border-radius:8px;border:1.5px solid var(--border);background:#fff;color:var(--text);font-family:var(--font);font-size:14px;}
.field-inner textarea{resize:vertical;min-height:60px;}
.field-inner input:focus,.field-inner select:focus,.field-inner textarea:focus{outline:none;border-color:var(--blue);}
.field-inner .fval{font-size:14px;font-weight:600;padding:4px 0;}
.fields-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px;}
.sec-title{font-size:13px;font-weight:800;color:var(--accent);margin:14px 0 8px;display:flex;align-items:center;gap:6px;}
.divider{border:none;border-top:2px dashed var(--border);margin:14px 0;}

/* BUTTONS */
.btn{padding:8px 16px;border-radius:10px;border:none;font-family:var(--font);font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;}
.btn:hover{opacity:.9;transform:translateY(-1px);}
.btn-blue{background:var(--blue);color:#fff;}
.btn-green{background:var(--green);color:#fff;}
.btn-gray{background:#f1f5f9;color:var(--text);border:1px solid var(--border);}
.btn-red{background:#fee2e2;color:var(--red);border:1px solid #fecaca;}
.btn-wa{background:#25D366;color:#fff;}
.btn-orange{background:#f97316;color:#fff;}

/* WORKERS/GROUPS */
.list-item{background:#fff;border:1.5px solid var(--border);border-radius:10px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px;box-shadow:var(--shadow);margin-bottom:6px;}
.add-row{display:flex;gap:8px;margin-bottom:12px;}
.add-row input{flex:1;padding:9px 12px;border-radius:10px;border:1.5px solid var(--border);background:#fff;font-family:var(--font);font-size:14px;}

/* STATS */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-bottom:16px;}
.stat-card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px;text-align:center;box-shadow:var(--shadow);}
.stat-num{font-size:26px;font-weight:800;margin-bottom:4px;}
.stat-lbl{font-size:11px;color:var(--muted);font-weight:500;}

/* WORKER VIEW */
.wv-hdr{background:linear-gradient(135deg,#1e293b,#334155);color:#fff;border-radius:16px;padding:18px;text-align:center;margin-bottom:14px;}
.wv-name{font-size:20px;font-weight:800;color:#f97316;}
.wv-sub{font-size:13px;color:rgba(255,255,255,.65);}

/* GROUPS MODAL */
.grp-check{display:flex;align-items:center;gap:10px;background:#f8fafc;border-radius:10px;padding:10px 12px;margin-bottom:6px;cursor:pointer;border:1.5px solid var(--border);}
.grp-check input{width:18px;height:18px;accent-color:var(--blue);cursor:pointer;}
.grp-check label{font-size:14px;cursor:pointer;flex:1;}
.report-preview{background:#f0f4f8;border-radius:10px;padding:12px;font-size:13px;white-space:pre-wrap;line-height:1.8;color:var(--text);margin-top:10px;max-height:200px;overflow-y:auto;}

/* PIN settings */
.pin-setting-row{display:flex;gap:8px;align-items:center;margin-bottom:10px;}
.pin-setting-row label{font-size:13px;color:var(--muted);min-width:90px;}
.pin-setting-row input{flex:1;padding:8px 10px;border-radius:8px;border:1.5px solid var(--border);font-family:var(--font);font-size:14px;letter-spacing:3px;}

/* AUTOCOMPLETE */
.ac-wrap{position:relative;}
.ac-input{width:100%;padding:8px 10px;border-radius:8px;border:1.5px solid var(--border);background:#fff;color:var(--text);font-family:var(--font);font-size:14px;}
.ac-input:focus{outline:none;border-color:var(--blue);}
.ac-dropdown{position:absolute;top:100%;right:0;left:0;background:#fff;border:1.5px solid var(--blue);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.15);z-index:1000;max-height:220px;overflow-y:auto;display:none;}
.ac-dropdown.open{display:block;}
.ac-item{padding:9px 12px;cursor:pointer;font-size:14px;border-bottom:1px solid #f1f5f9;transition:background .1s;}
.ac-item:last-child{border-bottom:none;}
.ac-item:hover,.ac-item.focused{background:#eff6ff;color:var(--blue);}
.ac-add{padding:9px 12px;cursor:pointer;font-size:13px;color:var(--green);font-weight:600;border-top:1px solid #f1f5f9;display:flex;align-items:center;gap:6px;}
.ac-add:hover{background:#f0fdf4;}

.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);padding:9px 22px;border-radius:20px;font-size:13px;font-weight:700;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;box-shadow:0 4px 20px rgba(0,0,0,.15);}

@media(max-width:480px){
  .fields-grid{grid-template-columns:1fr;}
  .page{padding:8px;}
  .stats-grid{grid-template-columns:repeat(2,1fr);}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-box">
    <div style="font-size:32px;margin-bottom:6px;">🔐</div>
    <h2>כניסת מנהל</h2>
    <p>הכנס קוד PIN בן 6 ספרות</p>
    <div class="pin-dots" id="pinDots">
      <div class="pin-dot" id="d0"></div><div class="pin-dot" id="d1"></div>
      <div class="pin-dot" id="d2"></div><div class="pin-dot" id="d3"></div>
      <div class="pin-dot" id="d4"></div><div class="pin-dot" id="d5"></div>
    </div>
    <div class="pin-pad">
      <button class="pin-btn" onclick="pp('1')">1</button><button class="pin-btn" onclick="pp('2')">2</button><button class="pin-btn" onclick="pp('3')">3</button>
      <button class="pin-btn" onclick="pp('4')">4</button><button class="pin-btn" onclick="pp('5')">5</button><button class="pin-btn" onclick="pp('6')">6</button>
      <button class="pin-btn" onclick="pp('7')">7</button><button class="pin-btn" onclick="pp('8')">8</button><button class="pin-btn" onclick="pp('9')">9</button>
      <button class="pin-btn" style="visibility:hidden"></button><button class="pin-btn" onclick="pp('0')">0</button><button class="pin-btn" style="font-size:16px;" onclick="pd()">⌫</button>
    </div>
    <div class="login-error" id="pinErr"></div>
    <div class="login-cancel" onclick="cancelLogin()">ביטול</div>
  </div>
</div>

<!-- NAV -->
<nav class="nav" id="mainNav" style="display:none;">
  <div class="nav-title">🔧 FDT</div>
  <div class="nav-right">
    <button class="tab active" onclick="showPage('tickets',event)">תקלות</button>
    <button class="tab" onclick="showPage('workers',event)">עובדים</button>
    <button class="tab" onclick="showPage('stats',event)">סטטיסטיקה</button>
    <button class="tab" id="settingsTab" style="display:none;" onclick="showPage('settings',event)">⚙️</button>
    <div class="role-pill" id="rolePill" onclick="handleRoleClick()">🔐 כניסה</div>
  </div>
</nav>

<!-- TICKETS PAGE -->
<div class="page active" id="page-tickets">
  <div class="toolbar">
    <button class="btn btn-orange" id="btnNew" style="display:none;" onclick="openTicketModal(null)">+ תקלה חדשה</button>
    <button class="btn btn-gray" id="btnExport" onclick="exportData()">📥 ייצוא Excel</button>
    <label class="btn btn-gray" style="cursor:pointer;">📤 ייבוא Excel<input type="file" accept=".csv,.xlsx" style="display:none;" onchange="importData(event)"></label>
  </div>
  <!-- BULK BAR -->
  <div class="bulk-bar" id="bulkBar">
    <span id="bulkCount">0 נבחרו</span>
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <button class="btn btn-wa" onclick="bulkSendWA()">📲 שלח נבחרים</button>
      <button class="btn btn-gray" style="color:#fff;" onclick="clearSelection()">✕ בטל</button>
    </div>
  </div>
  <div class="search-row">
    <input id="srch" type="text" placeholder="🔍 חיפוש..." oninput="renderTickets()">
    <select id="fltrW" onchange="renderTickets()"><option value="">כל העובדים</option></select>
    <select id="fltrS" onchange="renderTickets()">
      <option value="">כל הסטטוסים</option>
      <option value="סגור">סגור</option>
      <option value="בהמתנה">בהמתנה</option>
      <option value="המשך טיפול">המשך טיפול</option>
      <option value="__open__">פתוח</option>
    </select>
  </div>
  <div id="ticketList"></div>
  <div id="loadMsg" style="text-align:center;padding:40px;color:var(--muted);">⏳ טוען...</div>
</div>

<!-- WORKERS PAGE -->
<div class="page" id="page-workers">
  <div class="add-row" id="addWorkerRow" style="display:none;">
    <input id="newWorker" placeholder="שם עובד חדש..." onkeydown="if(event.key==='Enter')addWorker()">
    <button class="btn btn-blue" onclick="addWorker()">+ הוסף עובד</button>
  </div>
  <div id="workerList"></div>
</div>

<!-- STATS PAGE -->
<div class="page" id="page-stats">
  <div class="stats-grid" id="statsGrid"></div>
  <div id="workerStats"></div>
</div>

<!-- SETTINGS PAGE -->
<div class="page" id="page-settings">
  <div style="background:#fff;border-radius:14px;padding:18px;margin-bottom:12px;box-shadow:var(--shadow);">
    <div style="font-size:15px;font-weight:700;margin-bottom:14px;">🔐 קודי PIN</div>
    <div class="pin-setting-row"><label>מנהל ראשי:</label><input type="password" id="pinA" maxlength="6" placeholder="••••••"><button class="btn btn-gray" style="padding:6px 10px;font-size:12px;" onclick="savePin('admin','pinA')">שמור</button></div>
    <div class="pin-setting-row"><label>מנהל 2:</label><input type="password" id="pinB" maxlength="6" placeholder="••••••"><button class="btn btn-gray" style="padding:6px 10px;font-size:12px;" onclick="savePin('m2','pinB')">שמור</button></div>
    <div class="pin-setting-row"><label>מנהל 3:</label><input type="password" id="pinC" maxlength="6" placeholder="••••••"><button class="btn btn-gray" style="padding:6px 10px;font-size:12px;" onclick="savePin('m3','pinC')">שמור</button></div>
  </div>
  <div style="background:#fff;border-radius:14px;padding:18px;box-shadow:var(--shadow);">
    <div style="font-size:15px;font-weight:700;margin-bottom:12px;">📢 קבוצות WhatsApp</div>
    <div class="add-row">
      <input id="newGroup" placeholder="שם קבוצה..." onkeydown="if(event.key==='Enter')addGroup()">
      <button class="btn btn-blue" onclick="addGroup()">+ הוסף</button>
    </div>
    <div id="groupList"></div>
  </div>
</div>

<!-- TICKET MODAL -->
<div class="overlay" id="ticketOverlay" onclick="closeOO(event,'ticketOverlay')">
  <div class="modal">
    <div class="modal-hdr">
      <h2 id="ticketModalTitle">תקלה</h2>
      <button class="modal-close" onclick="closeO('ticketOverlay')">×</button>
    </div>
    <div class="modal-body">
      <div style="font-size:11px;color:var(--muted);margin-bottom:12px;background:#eff6ff;padding:7px 10px;border-radius:8px;">✔ סמן שדות לשליחה ל-WhatsApp</div>

      <!-- שורה 1: מס' טיקט (רוחב מלא) -->
      <div class="field-row" style="grid-column:1/-1;">
        <div class="field-cb"><input type="checkbox" id="cb_ticket" checked></div>
        <div class="field-inner"><label>מס' טיקט</label><input id="f_ticket" type="text"></div>
      </div>

      <!-- שורה 2: תאריך כניסה | נשלח ע"י -->
      <div class="fields-grid">
        <div class="field-row">
          <div class="field-cb"><input type="checkbox" id="cb_dateIn"></div>
          <div class="field-inner"><label>תאריך כניסה</label>
            <div style="display:flex;gap:5px;">
              <input id="f_dateIn" type="date" style="flex:1;padding:8px;border-radius:8px;border:1.5px solid var(--border);font-family:var(--font);font-size:14px;">
              <input id="f_dateIn_time" type="time" style="width:95px;padding:8px;border-radius:8px;border:1.5px solid var(--border);font-family:var(--font);font-size:14px;">
            </div>
          </div>
        </div>
        <div class="field-row">
          <div class="field-cb"><input type="checkbox" id="cb_sentBy"></div>
          <div class="field-inner"><label>נשלח ע"י</label><div class="ac-wrap" id="ac_sentBy"></div></div>
        </div>

        <!-- שורה 3: נשלח WhatsApp/Mail -->
        <div class="field-row" style="grid-column:1/-1;">
          <div class="field-cb"><input type="checkbox" id="cb_sentTo" checked></div>
          <div class="field-inner"><label>נשלח WhatsApp / Mail</label><div class="ac-wrap" id="ac_sentTo"></div></div>
        </div>

        <!-- שורה 4: מתחם | עיר -->
        <div class="field-row">
          <div class="field-cb"><input type="checkbox" id="cb_complex" checked></div>
          <div class="field-inner"><label>מתחם</label><div class="ac-wrap" id="ac_complex"></div></div>
        </div>
        <div class="field-row">
          <div class="field-cb"><input type="checkbox" id="cb_city" checked></div>
          <div class="field-inner"><label>עיר</label><div class="ac-wrap" id="ac_city"></div></div>
        </div>

        <!-- שורה 5: רחוב ובית | ארונית -->
        <div class="field-row">
          <div class="field-cb"><input type="checkbox" id="cb_street" checked></div>
          <div class="field-inner"><label>רחוב ובית</label><input id="f_street" type="text"></div>
        </div>
        <div class="field-row">
          <div class="field-cb"><input type="checkbox" id="cb_box" checked></div>
          <div class="field-inner"><label>מס' גוב / ארונית</label><input id="f_box" type="text"></div>
        </div>

        <!-- שורה 6: סוג העבודה | קבלן מבצע -->
        <div class="field-row">
          <div class="field-cb"><input type="checkbox" id="cb_workType" checked></div>
          <div class="field-inner"><label>סוג העבודה</label><div class="ac-wrap" id="ac_workType"></div></div>
        </div>
        <div class="field-row">
          <div class="field-cb"><input type="checkbox" id="cb_worker" checked></div>
          <div class="field-inner"><label>קבלן מבצע</label><div class="ac-wrap" id="ac_worker"></div></div>
        </div>

        <!-- שורה 7: תאריך הקפצה | זיהוי תקלה -->
        <div class="field-row">
          <div class="field-cb"><input type="checkbox" id="cb_kapaza"></div>
          <div class="field-inner"><label>תאריך הקפצה</label>
            <input id="f_kapaza" type="date" style="width:100%;padding:8px;border-radius:8px;border:1.5px solid var(--border);font-family:var(--font);font-size:14px;">
          </div>
        </div>
        <div class="field-row">
          <div class="field-cb"><input type="checkbox" id="cb_faultId" checked></div>
          <div class="field-inner"><label>זיהוי תקלה</label><div class="ac-wrap" id="ac_faultId"></div></div>
        </div>
      </div>

      <div class="divider"></div>
      <div class="sec-title">🔒 סגירת תקלה</div>
      <div class="fields-grid">
        <!-- סוג סגירה | סטטוס | תאריך סגירה -->
        <div class="field-row">

      <div style="font-size:13px;color:var(--muted);margin-bottom:10px;">בחר קבוצות לשליחה:</div>

      <button class="btn btn-wa" onclick="sendBulkToGroups()">📲 שלח</button>

<div class="toast" id="toast"></div>

<script>
const SHEET_ID='18xXvgAqArho6FzCEMP5csl63XMvzv6TdkKNU07gGMok';
const SHEET_NAME='הרחבות';
const APP_URL=window.location.href.split('?')[0];

const C={dateIn:0,sentBy:1,sentTo:2,ticket:3,city:4,complex:5,street:6,box:7,workType:8,worker:9,kapaza:10,faultId:11,closeType:12,status:13,closeDate:14,solution:15,notes:16};

const FIELD_MAP=[
  {id:'ticket',col:C.ticket,lbl:'מס\' טיקט'},
  {id:'dateIn',col:C.dateIn,lbl:'תאריך כניסה',isDate:true},
  {id:'city',col:C.city,lbl:'עיר'},
  {id:'complex',col:C.complex,lbl:'מתחם'},
  {id:'street',col:C.street,lbl:'רחוב ובית'},
  {id:'box',col:C.box,lbl:'ארונית'},
  {id:'workType',col:C.workType,lbl:'סוג עבודה'},
  {id:'worker',col:C.worker,lbl:'קבלן מבצע'},
  {id:'sentTo',col:C.sentTo,lbl:'נשלח ל'},
  {id:'sentBy',col:C.sentBy,lbl:'נשלח ע"י'},
  {id:'faultId',col:C.faultId,lbl:'זיהוי תקלה'},
  {id:'closeType',col:C.closeType,lbl:'סוג סגירה'},
  {id:'status',col:C.status,lbl:'סטטוס'},
  {id:'closeDate',col:C.closeDate,lbl:'תאריך סגירה',isDate:true},
  {id:'kapaza',col:C.kapaza,lbl:'תאריך הקפצה',isDate:true},
  {id:'solution',col:C.solution,lbl:'פתרון'},
  {id:'notes',col:C.notes,lbl:'הערות'},
];

// ── AUTH ──────────────────────────────────────
const PINS={admin:localStorage.getItem('pin_admin')||'161266',m2:localStorage.getItem('pin_m2')||'',m3:localStorage.getItem('pin_m3')||''};
let role=null,pinBuf='',loginCB=null;

function showLoginScreen(cb){pinBuf='';loginCB=cb;updDots();document.getElementById('pinErr').innerText='';document.getElementById('loginScreen').classList.add('open');}
function cancelLogin(){document.getElementById('loginScreen').classList.remove('open');pinBuf='';}
function pp(d){if(pinBuf.length>=6)return;pinBuf+=d;updDots();if(pinBuf.length===6)setTimeout(checkPin,120);}
function pd(){pinBuf=pinBuf.slice(0,-1);updDots();}
function updDots(){for(let i=0;i<6;i++)document.getElementById('d'+i).classList.toggle('filled',i<pinBuf.length);}
function checkPin(){
  const p=pinBuf;
  if(p===PINS.admin)role='admin';
  else if(PINS.m2&&p===PINS.m2)role='manager';
  else if(PINS.m3&&p===PINS.m3)role='manager';
  else{pinBuf='';updDots();document.getElementById('pinErr').innerText='קוד שגוי';shakeBox();return;}
  document.getElementById('loginScreen').classList.remove('open');
  pinBuf='';applyRole();if(loginCB){loginCB();loginCB=null;}
}
function shakeBox(){const b=document.querySelector('.login-box');b.style.transform='translateX(-8px)';setTimeout(()=>b.style.transform='translateX(8px)',80);setTimeout(()=>b.style.transform='',160);}
function handleRoleClick(){if(role)logout();else showLoginScreen(()=>{});}
function logout(){if(!confirm('לצאת?'))return;role=null;applyRole();toast('יצאת','#64748b');}
function applyRole(){
  const isMgr=role==='admin'||role==='manager';
  const isAdm=role==='admin';
  const pill=document.getElementById('rolePill');
  pill.innerText=isAdm?'👑 מנהל ראשי':isMgr?'👤 מנהל':'🔐 כניסה';
  document.getElementById('btnNew').style.display=isMgr?'':'none';
  document.getElementById('settingsTab').style.display=isAdm?'':'none';
  document.getElementById('addWorkerRow').style.display=isMgr?'flex':'none';
  renderTickets();renderWorkers();
}
function savePin(key,inputId){
  const v=document.getElementById(inputId).value.trim();
  if(v.length!==6||!/^\d+$/.test(v)){toast('PIN חייב להיות 6 ספרות','#dc2626');return;}
  PINS[key]=v;localStorage.setItem('pin_'+key,v);toast('✅ PIN עודכן');
}

// ── DATA ──────────────────────────────────────
let rows=[],currentRow=null,isNew=false,selectedRows=new Set();
let workers=JSON.parse(localStorage.getItem('fdt_workers')||'null')||['אור דיין','אור מימון','אליה מינס','אלירן סלע','אנטולי גולוקוז','אסף חאזי','בן מילשטין','גדי אדמוב','גיל אבוטבול','דוד בירקי','דוד רזניק','דימה אברמוב','דימה סמיונוב','דימה קודימוב','ולדימיר קירזנר','ניב ספדה','נריה מעטוף','סלבה אברוטוב','סרגיי ווריבודסקי','ראובן יצחק','רומה דויטשוילי','רוני דרמון','שואהנה','שלו לוי','עמירן מכלוף','גנדי',"נדצ'יב",'אלכסיי דניסנקו','פנחס בראון','יונתן סיסאי'];
let groups=JSON.parse(localStorage.getItem('fdt_groups')||'null')||['תקלות gpon אופטיקה שרון צפוני תיקום','סיבים נתניה -פרדס חנה🟦🔵','רעננה הרצליה ראש העין ק.אונו🚩🟥','בזק תייקום תקלות מיידי','תקלות gpon תשתיות שרון צפוני תייקום','תקלות תייקום דרום השרון','📣פתיחת תקלות GPON📣','סיבים פתח תקווה סובב','תקלות תייקום גיפון'];
let reportMsg='';
function saveW(){localStorage.setItem('fdt_workers',JSON.stringify(workers));}
function saveG(){localStorage.setItem('fdt_groups',JSON.stringify(groups));}

// ── LOAD ──────────────────────────────────────
async function loadData(){
  try{
    const url=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(SHEET_NAME)}`;
    const r=await fetch(url),text=await r.text();
    const json=JSON.parse(text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\)/)[1]);
    rows=json.table.rows.map((row,i)=>({ri:i+2,d:row.c.map(c=>c?c.v||c.f||'':'')}));
    document.getElementById('loadMsg').style.display='none';
    renderTickets();renderStats();renderWorkers();populateFltr();
  }catch(e){document.getElementById('loadMsg').innerHTML='⚠️ שגיאה בטעינה';}
}

// ── TICKETS ───────────────────────────────────
function renderTickets(){
  const s=document.getElementById('srch').value.toLowerCase();
  const fw=document.getElementById('fltrW').value;
  const fs=document.getElementById('fltrS').value;
  let f=rows.filter(r=>{
    const d=r.d;
    const ms=!s||[d[C.ticket],d[C.city],d[C.street],d[C.box],d[C.worker]].some(v=>String(v).toLowerCase().includes(s));
    const mw=!fw||d[C.worker]===fw;
    let mst=fs==='__open__'?(!d[C.status]||d[C.status]===''):!fs||d[C.status]===fs;
    return ms&&mw&&mst;
  }).slice(-300).reverse();
  const el=document.getElementById('ticketList');
  if(!f.length){el.innerHTML='<div style="text-align:center;padding:40px;color:var(--muted);">לא נמצאו תקלות</div>';return;}
  el.innerHTML=f.map(r=>{
    const d=r.d,st=d[C.status];
    const bc=st==='סגור'?'b-closed':st==='בהמתנה'?'b-wait':st==='המשך טיפול'?'b-cont':'b-open';
    const sel=selectedRows.has(r.ri);
    return `<div class="ticket-row${sel?' selected':''}" id="tr_${r.ri}">
      <div class="ticket-cb" onclick="toggleSel(event,${r.ri})"><input type="checkbox" ${sel?'checked':''} onclick="toggleSel(event,${r.ri})"></div>
      <div class="ticket-body" onclick="openTicketModal(${r.ri})">
        <div class="ticket-top"><span class="ticket-id">#${d[C.ticket]}</span><span class="ticket-worker">👷 ${d[C.worker]||'—'}</span></div>
        <div class="ticket-addr">📍 ${d[C.city]} | ${d[C.street]} | ${d[C.box]}</div>
        <div class="ticket-badges">
          <span class="badge ${bc}">${st||'פתוח'}</span>
          <span class="badge b-gray">${d[C.workType]||'—'}</span>
          ${d[C.faultId]?`<span class="badge b-gray">${d[C.faultId]}</span>`:''}
        </div>
      </div>
    </div>`;
  }).join('');
}

function toggleSel(e,ri){
  e.stopPropagation();
  if(selectedRows.has(ri))selectedRows.delete(ri);else selectedRows.add(ri);
  updateBulkBar();renderTickets();
}
function updateBulkBar(){
  const n=selectedRows.size;
  document.getElementById('bulkBar').classList.toggle('show',n>0);
  document.getElementById('bulkCount').innerText=`${n} נבחרו`;
}
function clearSelection(){selectedRows.clear();updateBulkBar();renderTickets();}

function populateFltr(){
  document.getElementById('fltrW').innerHTML='<option value="">כל העובדים</option>'+workers.map(w=>`<option value="${w}">${w}</option>`).join('');
}

// ── TICKET MODAL ──────────────────────────────
const AC_FIELDS=['city','complex','workType','worker','faultId','closeType','status','sentBy','sentTo'];
const FIDS=['ticket','dateIn','street','box','kapaza','solution','notes'];

function openTicketModal(ri){
  isNew=ri===null;
  currentRow=ri?rows.find(r=>r.ri===ri):null;
  const isMgr=role==='admin'||role==='manager';
  document.getElementById('ticketModalTitle').innerText=isNew?'תקלה חדשה ➕':`טיקט #${currentRow?currentRow.d[C.ticket]:''}`;
  document.getElementById('btnSave').style.display=isMgr?'':'none';
  document.getElementById('btnDel').style.display=role==='admin'&&!isNew?'':'none';

  // fill fields
  FIDS.forEach(id=>{
    const el=document.getElementById('f_'+id);
    if(!el) return;
    const fm=FIELD_MAP.find(f=>f.id===id);
    if(!fm) return;
    const val=currentRow?currentRow.d[fm.col]||'':'';
    if(el.tagName==='SELECT'){el.value=val;}
    else if(el.type==='date'){setDI('f_'+id,val);}
    else{el.value=val;}
    // enable/disable editing
    el.disabled=!isMgr&&['closeType','status','closeDate','solution','notes'].indexOf(id)===-1;
  });
  ['f_dateIn_time','f_closeDate_time'].forEach(id=>{const el=document.getElementById(id);if(el){el.value='';el.disabled=!isMgr;}});

  // init autocomplete fields
  initACs(currentRow, isMgr);

  document.getElementById('ticketOverlay').classList.add('open');
}

function saveTicket(){
  const isMgr=role==='admin'||role==='manager';
  if(!isMgr){toast('אין הרשאה','#dc2626');return;}
  if(!currentRow&&!isNew) return;
  const data=currentRow?currentRow.d:[...Array(17)].map(()=>'');
  FIDS.forEach(id=>{
    const el=document.getElementById('f_'+id);
    if(!el||el.disabled) return;
    const fm=FIELD_MAP.find(f=>f.id===id);
    if(fm) data[fm.col]=el.value;
  });
  // read date fields
  data[C.dateIn]=getDIValue('f_dateIn');
  data[C.kapaza]=getDIValue('f_kapaza');
  data[C.closeDate]=getDIValue('f_closeDate');
  // read AC fields
  AC_FIELDS.forEach(id=>{
    const el=document.getElementById('f_'+id);
    if(!el) return;
    const fm=FIELD_MAP.find(f=>f.id===id);
    if(fm) data[fm.col]=el.value;
  });
  if(isNew){
    const newR={ri:rows.length>0?Math.max(...rows.map(r=>r.ri))+1:2,d:data};
    rows.push(newR);toast('✅ תקלה נוצרה');
  }else{
    currentRow.d=data;toast('✅ נשמר');
  }
  closeO('ticketOverlay');renderTickets();renderStats();
}

function deleteTicket(){
  if(!currentRow||!confirm(`מחק טיקט #${currentRow.d[C.ticket]}?`)) return;
  rows=rows.filter(r=>r.ri!==currentRow.ri);
  closeO('ticketOverlay');renderTickets();renderStats();toast('🗑 נמחק','#dc2626');
}

// ── WA FROM TICKET MODAL ──────────────────────
function sendCheckedFieldsWA(){
  const lines=['*משימה חדשה* 🔧\n'];
  FIELD_MAP.forEach(fm=>{
    const cb=document.getElementById('cb_'+fm.id);
    if(!cb||!cb.checked) return;
    let val='';
    if(fm.isDate){
      val=getDIDisplay('f_'+fm.id);
    } else {
      const el=document.getElementById('f_'+fm.id);
      if(el) val=el.value;
    }
    if(val) lines.push(`*${fm.lbl}:* ${val}`);
  });
  const worker=document.getElementById('f_worker');
  const wVal=worker?worker.value:'';
  if(wVal){
    const link=`${APP_URL}?worker=${encodeURIComponent(wVal)}`;
    lines.push(`\nלצפייה ועדכון:\n${link}`);
  }
  window.open(`https://wa.me/?text=${encodeURIComponent(lines.join('\n'))}`,'_blank');
}

// ── BULK SEND ─────────────────────────────────
function bulkSendWA(){
  if(!selectedRows.size) return;
  const selR=rows.filter(r=>selectedRows.has(r.ri));
  let msg='*רשימת תקלות* 🔧\n\n';
  selR.forEach((r,i)=>{
    const d=r.d;
    msg+=`${i+1}. *#${d[C.ticket]}* | ${d[C.city]} | ${d[C.street]} | ${d[C.box]} | ${d[C.worker]||'—'} | ${d[C.status]||'פתוח'}\n`;
  });
  reportMsg=msg;
  // show groups modal
  renderGrpCheckList('bulkGrpList',null);
  document.getElementById('bulkPreview').innerText=msg;
  document.getElementById('bulkOverlay').classList.add('open');
}
function sendBulkToGroups(){
  const sel=groups.filter((g,i)=>{const el=document.getElementById('bgrp_'+i);return el&&el.checked;});
  if(!sel.length){toast('בחר קבוצה','#dc2626');return;}
  sel.forEach((g,i)=>setTimeout(()=>window.open(`https://wa.me/?text=${encodeURIComponent(reportMsg)}`,'_blank'),i*700));
  closeO('bulkOverlay');clearSelection();toast(`✅ נשלח ל-${sel.length} קבוצות`);
}

// ── GROUPS MODAL (worker report) ──────────────
let workerReportData=null;
function openGroupsModal(data,defaultGrp){
  workerReportData=data;
  renderGrpCheckList('grpCheckList',defaultGrp);
  const msg=buildReport(data);
  reportMsg=msg;
  document.getElementById('reportPreview').innerText=msg;
  document.getElementById('groupsOverlay').classList.add('open');
}
function renderGrpCheckList(elId,defaultGrp){
  document.getElementById(elId).innerHTML=groups.map((g,i)=>{
    const prefix=elId==='bulkGrpList'?'bgrp_':'grp_';
    const checked=g===defaultGrp;
    return `<div class="grp-check">
      <input type="checkbox" id="${prefix}${i}" ${checked?'checked':''}>
      <label for="${prefix}${i}">${g}</label>
    </div>`;
  }).join('');
}
function sendToGroups(){
  const sel=groups.filter((g,i)=>{const el=document.getElementById('grp_'+i);return el&&el.checked;});
  if(!sel.length){toast('בחר קבוצה','#dc2626');return;}
  sel.forEach((g,i)=>setTimeout(()=>window.open(`https://wa.me/?text=${encodeURIComponent(reportMsg)}`,'_blank'),i*700));
  closeO('groupsOverlay');toast(`✅ נשלח ל-${sel.length} קבוצות`);
}
function buildReport(d){
  return `*דוח סגירת תקלה* ✅\n\n`+
    `🎫 *טיקט:* ${d.ticket||'—'}\n`+
    `👥 *מי שלח:* ${d.sentTo||'—'}\n`+
    `📍 *עיר:* ${d.city||'—'}\n`+
    `🏘 *מתחם:* ${d.complex||'—'}\n`+
    `🏠 *רחוב:* ${d.street||'—'}\n`+
    `📦 *ארונית:* ${d.box||'—'}\n`+
    `🔧 *סוג תקלה:* ${d.workType||'—'}\n`+
    `🔒 *סוג סגירה:* ${d.closeType||'—'}\n`+
    `✅ *פתרון:* ${d.solution||'—'}`;
}

// ── WORKERS ───────────────────────────────────
function renderWorkers(){
  const isMgr=role==='admin'||role==='manager';
  document.getElementById('workerList').innerHTML=workers.map((w,i)=>`
    <div class="list-item">
      <span style="font-weight:600;">👷 ${w}</span>
      <div style="display:flex;gap:6px;">
        <button class="btn btn-wa" style="padding:5px 9px;font-size:12px;" onclick="sendWorkerLink('${w.replace(/'/g,"\\'")}')">📲</button>
        ${isMgr?`<button class="btn btn-red" style="padding:5px 9px;font-size:12px;" onclick="removeWorker(${i})">🗑</button>`:''}
      </div>
    </div>`).join('');
}
function addWorker(){const v=document.getElementById('newWorker').value.trim();if(!v)return;workers.push(v);saveW();document.getElementById('newWorker').value='';renderWorkers();populateFltr();toast('✅ עובד נוסף');}
function removeWorker(i){if(!confirm(`מחק ${workers[i]}?`))return;workers.splice(i,1);saveW();renderWorkers();populateFltr();}
function sendWorkerLink(w){const link=`${APP_URL}?worker=${encodeURIComponent(w)}`;window.open(`https://wa.me/?text=${encodeURIComponent(`שלום ${w} 👋\nהתקלות שלך:\n${link}`)}`,'_blank');}

// ── GROUPS SETTINGS ───────────────────────────
function renderGroups(){
  document.getElementById('groupList').innerHTML=groups.map((g,i)=>`
    <div class="list-item">
      <span style="font-size:13px;font-weight:500;">${g}</span>
      <button class="btn btn-red" style="padding:5px 9px;font-size:12px;" onclick="removeGroup(${i})">🗑</button>
    </div>`).join('');
}
function addGroup(){const v=document.getElementById('newGroup').value.trim();if(!v)return;groups.push(v);saveG();document.getElementById('newGroup').value='';renderGroups();toast('✅ קבוצה נוספה');}
function removeGroup(i){if(!confirm(`מחק "${groups[i]}"?`))return;groups.splice(i,1);saveG();renderGroups();}

// ── STATS ─────────────────────────────────────
function renderStats(){
  const t=rows.length,cl=rows.filter(r=>r.d[C.status]==='סגור').length,wt=rows.filter(r=>r.d[C.status]==='בהמתנה').length,cn=rows.filter(r=>r.d[C.status]==='המשך טיפול').length,op=t-cl-wt-cn;
  document.getElementById('statsGrid').innerHTML=`

async function loadWorkerData(w){

    rows=json.table.rows.map((row,i)=>({ri:i+2,d:row.c.map(c=>c?c.v||c.f||'':'')}));

        </div>

        <div style="font-size:13px;color:var(--muted);margin-bottom:8px;">📦 ${d[C.box]} | 🔧 ${d[C.workType]}</div>
        ${d[C.sentTo]?`<div style="font-size:13px;color:var(--blue);margin-bottom:8px;">👥 ${d[C.sentTo]}</div>`:''}
        ${d[C.faultId]?`<div style="font-size:13px;padding:7px 10px;background:#fff7ed;border-radius:8px;color:#c2410c;margin-bottom:10px;">⚠️ ${d[C.faultId]}</div>`:''}

          <select id="wst_${r.ri}" style="padding:8px 10px;border-radius:8px;border:1.5px solid var(--border);font-family:var(--font);font-size:14px;">

            <option value="סגור" ${d[C.status]==='סגור'?'selected':''}>סגור</option>
            <option value="בהמתנה" ${d[C.status]==='בהמתנה'?'selected':''}>בהמתנה</option>

function wSave(ri){
  const r=rows.find(r=>r.ri===ri);if(!r) return;
  const closeType=document.getElementById('wct_'+ri).value.trim();
  const status=document.getElementById('wst_'+ri).value;
  const solution=document.getElementById('wsol_'+ri).value.trim();
  r.d[C.closeType]=closeType;r.d[C.status]=status;r.d[C.solution]=solution;
  const data={ticket:r.d[C.ticket],sentTo:r.d[C.sentTo],city:r.d[C.city],complex:r.d[C.complex],street:r.d[C.street],box:r.d[C.box],workType:r.d[C.workType],closeType,solution};
  openGroupsModal(data,r.d[C.sentTo]);
}

function exportData(){
  const headers=['תאריך כניסה','נשלח ע"י','נשלח WhatsApp/Mail','מס\' טיקט','עיר','מתחם','רחוב ובית','מס\' גוב/ארונית','סוג העבודה','קבלן מבצע','תאריך הקפצה','זיהוי תקלה','סוג סגירת התקלה','סטטוס','תאריך סגירה','פתרון','הערות'];
  const csv=['\uFEFF'+headers.join(','),...rows.map(r=>r.d.map(v=>'"'+String(v||'').replace(/"/g,'""')+'"').join(','))].join('\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='FDT_export_'+new Date().toISOString().split('T')[0]+'.csv';a.click();
  toast('✅ ייצוא הושלם');
}
function importData(e){
  const file=e.target.files[0];if(!file) return;
  const reader=new FileReader();
  reader.onload=ev=>{
    const lines=ev.target.result.split('\n').filter(l=>l.trim());
    const imported=lines.slice(1).map((line,i)=>{
      const cols=line.match(/(".*?"|[^,]+)(?=,|$)/g)||[];
      const data=cols.map(v=>v.replace(/^"|"$/g,'').replace(/""/g,'"'));
      while(data.length<17) data.push('');
      return{ri:10000+i,d:data};
    });
    rows=[...rows,...imported];
    renderTickets();renderStats();
    toast(`✅ יובאו ${imported.length} שורות`);
  };
  reader.readAsText(file,'utf-8');
  e.target.value='';
}

// ── HELPERS ───────────────────────────────────
function fmtDate(val){
  if(!val) return '—';
  if(typeof val==='number'){const d=new Date(Math.round((val-25569)*86400*1000));return d.toLocaleDateString('he-IL',{day:'2-digit',month:'2-digit',year:'numeric'});}
  const m=String(val).match(/Date\((\d+),(\d+),(\d+)/);
  if(m){const d=new Date(parseInt(m[1]),parseInt(m[2]),parseInt(m[3]));return d.toLocaleDateString('he-IL',{day:'2-digit',month:'2-digit',year:'numeric'});}
  return String(val);
}
function formatDateStr(s,timeId){
  if(!s) return '';
  const p=s.split('-');
  const dateStr=p.length===3?`${p[2]}/${p[1]}/${p[0]}`:s;
  const timeEl=timeId?document.getElementById(timeId):null;
  const timeVal=timeEl?timeEl.value:'';
  return timeVal?`${dateStr} ${timeVal}`:dateStr;
}
function setDI(id,val){
  const el=document.getElementById(id);if(!el)return;
  if(!val){el.value='';return;}
  let d=null;
  if(typeof val==='number')d=new Date(Math.round((val-25569)*86400*1000));
  else{const m=String(val).match(/Date\((\d+),(\d+),(\d+)/);if(m)d=new Date(parseInt(m[1]),parseInt(m[2]),parseInt(m[3]));}
  el.value=d?d.toISOString().split('T')[0]:'';
}
function getDIValue(id){const el=document.getElementById(id);return el?el.value:'';}
function getDIDisplay(id){
  const el=document.getElementById(id);
  if(!el||!el.value)return '';
  const p=el.value.split('-');
  const dateStr=p.length===3?p[2]+'/'+p[1]+'/'+p[0]:el.value;
  const tEl=document.getElementById(id+'_time');
  return dateStr+(tEl&&tEl.value?' '+tEl.value:'');
}
function showPage(id,e){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('page-'+id).classList.add('active');
  if(e&&e.target)e.target.classList.add('active');
  if(id==='settings')renderGroups();
}
function closeO(id){document.getElementById(id).classList.remove('open');}
function closeOO(e,id){if(e.target.id===id)closeO(id);}
function toast(msg,color){
  const t=document.getElementById('toast');
  t.style.background=color||'#16a34a';t.style.color='#fff';
  t.style.opacity='1';t.innerText=msg;
  clearTimeout(t._t);t._t=setTimeout(()=>t.style.opacity='0',3000);
}

function saveList(key){if(key!=='worker')localStorage.setItem('list_'+key,JSON.stringify(LISTS[key]));}

// ── AUTOCOMPLETE ENGINE ────────────────────────
function createAC(containerId, listKey, initialValue, disabled){
  const wrap=document.getElementById(containerId);
  if(!wrap) return;
  const inputId='f_'+listKey;
  wrap.innerHTML=`
    <input class="ac-input" id="${inputId}" type="text" value="${initialValue||''}" autocomplete="off" ${disabled?'disabled':''}>
    <div class="ac-dropdown" id="dd_${listKey}"></div>`;
  if(disabled) return;
  const input=document.getElementById(inputId);
  const dd=document.getElementById('dd_'+listKey);
  let focusIdx=-1;

  function getList(){return listKey==='worker'?workers:LISTS[listKey];}

  function showDD(q){
    const list=getList();
    const filtered=q?list.filter(i=>i.toLowerCase().includes(q.toLowerCase())):list;
    dd.innerHTML='';
    focusIdx=-1;
    filtered.slice(0,20).forEach((item,i)=>{
      const el=document.createElement('div');
      el.className='ac-item';
      el.innerHTML=q?item.replace(new RegExp('('+q+')','gi'),'<b>$1</b>'):item;
      el.onmousedown=()=>{input.value=item;dd.classList.remove('open');};
      dd.appendChild(el);
    });
    // Add option
    const addEl=document.createElement('div');
    addEl.className='ac-add';
    addEl.innerHTML='➕ הוסף חדש';
    addEl.onmousedown=()=>{
      const newVal=input.value.trim();
      if(!newVal){toast('הכנס ערך','#dc2626');return;}
      const list2=getList();
      if(!list2.includes(newVal)){
        list2.push(newVal);
        if(listKey==='worker'){saveW();}else{saveList(listKey);}
        toast('✅ נוסף: '+newVal);
      }
      dd.classList.remove('open');
    };
    dd.appendChild(addEl);
    dd.classList.add('open');
  }

  input.addEventListener('focus',()=>showDD(input.value));
  input.addEventListener('input',()=>showDD(input.value));
  input.addEventListener('blur',()=>setTimeout(()=>dd.classList.remove('open'),150));
  input.addEventListener('keydown',e=>{
    const items=dd.querySelectorAll('.ac-item');
    if(e.key==='ArrowDown'){focusIdx=Math.min(focusIdx+1,items.length-1);}
    else if(e.key==='ArrowUp'){focusIdx=Math.max(focusIdx-1,0);}
    else if(e.key==='Enter'&&focusIdx>=0){input.value=items[focusIdx].innerText;dd.classList.remove('open');e.preventDefault();return;}
    else if(e.key==='Escape'){dd.classList.remove('open');return;}
    items.forEach((el,i)=>el.classList.toggle('focused',i===focusIdx));
  });
}

function getComplexList(){
  const cityEl=document.getElementById('f_city');
  const city=cityEl?cityEl.value.trim():'';
  const fromMap=CITY_COMPLEX[city]||[];
  // merge with any manually added
  const saved=JSON.parse(localStorage.getItem('list_complex_'+city)||'[]');
  return [...new Set([...fromMap,...saved])];
}

function initACs(row, isMgr){
  const d=row?row.d:null;
  createAC('ac_city',     'city',      d?d[C.city]||'':'',      !isMgr);
  createAC('ac_workType', 'workType',  d?d[C.workType]||'':'',  !isMgr);
  createAC('ac_worker',   'worker',    d?d[C.worker]||'':'',    !isMgr);
  createAC('ac_faultId',  'faultId',   d?d[C.faultId]||'':'',   !isMgr);
  createAC('ac_closeType','closeType', d?d[C.closeType]||'':'', false);
  createAC('ac_status',   'status',    d?d[C.status]||'':'',    false);
  createAC('ac_sentBy',   'sentBy',    d?d[C.sentBy]||'':'',    !isMgr);
  createAC('ac_sentTo',   'sentTo',    d?d[C.sentTo]||'':'',    !isMgr);
  // complex — special: filtered by city, re-init when city changes
  initComplexAC(d?d[C.complex]||'':'', !isMgr);
  // watch city changes to refresh complex
  const cityEl=document.getElementById('f_city');
  if(cityEl) cityEl.addEventListener('input', ()=>initComplexAC('',!isMgr));
}

  input.addEventListener('keydown',e=>{

    else if(e.key==='Escape'){dd.classList.remove('open');return;}
